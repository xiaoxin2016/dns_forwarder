name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release: creates the tag on the selected branch's commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::tag '${VERSION}' must start with v"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} already exists"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build Windows binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 386 arm64; do
            name="dns_forwarder_${VERSION}_windows_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS=windows GOARCH="${arch}" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}/dns_forwarder.exe" .
            cp hosts dns.txt README.md "dist/${name}/"
            (cd dist && zip -qr "${name}.zip" "${name}")
          done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
